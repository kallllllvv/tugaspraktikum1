<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Praktikum - Haikal Apriandi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Latar belakang gradasi biru/ungu */
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .badge {
            background-color: #ff6b81;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }
        h1 {
            color: #2f3542;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #747d8c;
            margin-bottom: 30px;
        }
        .identitas {
            border: 2px dashed #a1c4fd;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #2f3542;
            background-color: #f1f2f6;
        }
        .waktu-box {
            margin-top: 20px;
            padding: 12px;
            border: 1px solid #dfe4ea;
            border-radius: 10px;
            font-size: 14px;
            color: #57606f;
        }
        .waktu-box span {
            font-weight: bold;
            color: #2f3542;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">🚀 Vercel Web Test</div>
        
        <h1>Deployment Web Statis Berhasil!</h1>
        <p>Website ini berjalan di atas platform Vercel</p>
        
        <div class="identitas">
            Haikal Apriandi - 102042430031
        </div>

        <div class="waktu-box">
            Waktu Sekarang:<br>
            <span id="waktu">Memuat waktu...</span>
        </div>
    </div>

    <script>
        // Script untuk menampilkan waktu real-time
        function updateWaktu() {
            const sekarang = new Date();
            
            // Format tanggal: DD/MM/YYYY
            const tanggal = String(sekarang.getDate()).padStart(2, '0');
            const bulan = String(sekarang.getMonth() + 1).padStart(2, '0');
            const tahun = sekarang.getFullYear();
            
            // Format waktu: HH:MM:SS
            const jam = String(sekarang.getHours()).padStart(2, '0');
            const menit = String(sekarang.getMinutes()).padStart(2, '0');
            const detik = String(sekarang.getSeconds()).padStart(2, '0');
            
            const formatWaktu = `${tanggal}/${bulan}/${tahun}, ${jam}:${menit}:${detik}`;
            document.getElementById('waktu').textContent = formatWaktu;
        }

        // Jalankan fungsi setiap 1 detik
        setInterval(updateWaktu, 1000);
        updateWaktu(); // Panggil sekali agar langsung muncul
    </script>
</body>
</html>
